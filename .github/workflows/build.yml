name: build

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
    outputs:
      apk-full-name:
        value: ${{ jobs.build.outputs.apk-full-name }}
      apk-pluginless-name:
        value: ${{ jobs.build.outputs.apk-pluginless-name }}
      apk-name:
        value: ${{ jobs.build.outputs.apk-full-name }}
      ver-name:
        value: ${{ jobs.build.outputs.ver-name }}
      ver-code:
        value: ${{ jobs.build.outputs.ver-code }}
      app-ver-code:
        value: ${{ jobs.build.outputs.app-ver-code }}
      build-num:
        value: ${{ jobs.build.outputs.build-num }}
      tag:
        value: ${{ jobs.build.outputs.tag }}
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  push:
    branches: [main, next]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  ARTIFACT_NAME: ${{ inputs.artifact-name || format('fagram-build-{0}', github.run_id) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            worktree: worktree
          - variant: pluginless
            worktree: worktree-pluginless
    outputs:
      apk-full-name: ${{ steps.info.outputs.apk-full-name }}
      apk-pluginless-name: ${{ steps.info.outputs.apk-pluginless-name }}
      apk-name: ${{ steps.info.outputs.apk-full-name }}
      ver-name: ${{ steps.info.outputs.ver-name }}
      ver-code: ${{ steps.info.outputs.ver-code }}
      app-ver-code: ${{ steps.info.outputs.app-ver-code }}
      build-num: ${{ steps.info.outputs.build-num }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.email ci@fagram
          git config --global user.name 'fagram ci'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install libclang
        if: matrix.variant == 'full'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Cache cargo
        if: matrix.variant == 'full'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/native/Cargo.lock', 'src/native/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install android rust toolchain
        if: matrix.variant == 'full'
        working-directory: src/native
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Test plugin engine
        if: matrix.variant == 'full'
        working-directory: src/native
        run: cargo test --locked

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: true
          key: fagram-android-ndk-27.2-release-${{ matrix.variant }}
          restore-keys: |
            fagram-android-ndk-27.2-release-${{ matrix.variant }}
            fagram-android-ndk-27.2-release
            fagram-android-ndk-
          max-size: 5G
          verbose: 2

      - name: Set up worktree
        run: pnpm run setup -- --ci ${{ matrix.variant == 'pluginless' && '--pluginless' || '' }}

      - name: Typecheck plugins
        if: matrix.variant == 'full'
        run: pnpm run typecheck-plugins

      - name: Upload plugin typings
        uses: actions/upload-artifact@v4
        if: matrix.variant == 'full'
        with:
          name: ${{ env.ARTIFACT_NAME }}-sdk
          path: |
            sdk/types/android.tl.d.ts
            sdk/types/tl-names.txt
          if-no-files-found: error
          retention-days: 1

      - name: Compute build info
        id: info
        env:
          FA_BUILD: ${{ vars.FA_BUILD || '1' }}
          INU_BUILD: ${{ vars.FA_BUILD || '1' }}
        run: pnpm tsx scripts/ci/version.ts ${{ matrix.variant == 'pluginless' && '--pluginless' || '' }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            cmake;3.31.6
            ndk;27.2.12479018

      - name: Tune Gradle properties
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          android.native.buildOutput=verbose
          EOF

      - name: Test (InuCore)
        working-directory: ${{ matrix.worktree }}
        run: ./gradlew --no-daemon :InuCore:check

      - name: Reset ccache stats
        run: ccache -z

      - name: Build (unsigned, debug-keyed)
        working-directory: ${{ matrix.worktree }}
        env:
          COMMIT_ID: ${{ github.sha }}
          INU_BUILD: ${{ steps.info.outputs.build-num }}
          FA_BUILD: ${{ steps.info.outputs.build-num }}
          INU_BUILD_TYPE: release
          FA_BUILD_TYPE: release
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}/${{ matrix.worktree }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: ./gradlew --no-daemon :TMessagesProj_App:assembleRelease

      - name: Show ccache stats
        if: always()
        run: ccache -s -v

      - name: Stage artifacts
        run: |
          mkdir -p out
          apk='${{ matrix.variant == 'full' && steps.info.outputs.apk-full-name || steps.info.outputs.apk-pluginless-name }}'
          cp '${{ matrix.worktree }}/TMessagesProj_App/build/outputs/apk/release/app.apk' "out/$apk"
          if [ '${{ matrix.variant }}' != full ]; then
            exit 0
          fi

          base=$(git describe --tags --abbrev=0 --match 'v*' --exclude '${{ steps.info.outputs.tag }}' HEAD 2>/dev/null || true)
          jq -n \
            --arg verName '${{ steps.info.outputs.ver-name }}' \
            --argjson verCode '${{ steps.info.outputs.ver-code }}' \
            --argjson appVerCode '${{ steps.info.outputs.app-ver-code }}' \
            --argjson buildNum '${{ steps.info.outputs.build-num }}' \
            --arg apkFull '${{ steps.info.outputs.apk-full-name }}' \
            --arg apkPluginless '${{ steps.info.outputs.apk-pluginless-name }}' \
            --arg baseTag "$base" \
            --arg commitSha "$GITHUB_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{verName:$verName,verCode:$verCode,appVerCode:$appVerCode,buildNum:$buildNum,apkFiles:{full:$apkFull,pluginless:$apkPluginless},baseTag:(if $baseTag == "" then null else $baseTag end),commitSha:$commitSha,repo:$repo}' \
            > out/build-info.json

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-unsigned-${{ matrix.variant }}
          path: out/*
          if-no-files-found: error
          retention-days: 1
