name: release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      artifact-name: fagram-${{ github.sha }}

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: signing
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: read
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: build-tools;36.0.0

      - name: Download unsigned artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fagram-${{ github.sha }}-unsigned-*
          merge-multiple: true
          path: out

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Sign APKs with apksigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          apksigner=$ANDROID_HOME/build-tools/36.0.0/apksigner
          for apk in '${{ needs.build.outputs.apk-full-name }}' '${{ needs.build.outputs.apk-pluginless-name }}'; do
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --in "out/$apk" \
              --out "out/$apk.signed"
            "$apksigner" verify --print-certs "out/$apk.signed"
            mv "out/$apk.signed" "out/$apk"
          done

      - name: Wipe keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Attest signed APKs
        uses: actions/attest@v4
        with:
          subject-path: out/*.apk

      - name: Upload signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fagram-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  upload:
    needs: [build, sign]
    if: github.repository == 'fagramdesktop/android'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/tgupload.py
          depth: 1

      - name: Download signed artifact
        uses: actions/download-artifact@v4
        with:
          name: fagram-${{ github.sha }}
          path: out

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          HEAD_SHA="$GITHUB_SHA"

          PREV_TAG=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.tag_name // empty')

          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            COMPARE=$(curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/compare/$PREV_TAG...$HEAD_SHA")
            CHANGELOG=$(echo "$COMPARE" | jq -r '[.commits[]? | select(.author.login == "Burhanverse" or .committer.login == "Burhanverse") | "• " + (.commit.message | split("\n")[0]) + " [֍](" + .html_url + ")"] | reverse | join("\n")')
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No new changes"
          fi
          CHANGELOG=$(echo "$CHANGELOG" | head -15)

          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          tag='${{ needs.build.outputs.tag }}'
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            "out/${{ needs.build.outputs.apk-full-name }}" \
            "out/${{ needs.build.outputs.apk-pluginless-name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install kurigram tgcrypto

      - name: Upload APKs to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID_CONFIG || secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.API_HASH_CONFIG || secrets.TELEGRAM_API_HASH }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHANGELOG: ${{ env.CHANGELOG }}
        run: |
          for apk in '${{ needs.build.outputs.apk-full-name }}' '${{ needs.build.outputs.apk-pluginless-name }}'; do
            APK_FILE="out/$apk"
            SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
            variant_suffix=""
            if [[ "$apk" == *"-pluginless"* ]]; then
              variant_suffix=" (Pluginless)"
            fi
            python3 .github/scripts/tgupload.py "$APK_FILE" \
              --chat-id "${{ secrets.CHAT_ID }}" \
              --title "FAgram Android ${{ needs.build.outputs.tag }}$variant_suffix" \
              --base-version "${{ needs.build.outputs.ver-name }}" \
              --checksum "$SHA256" \
              --build-type "rel" \
              --branch "${{ github.ref_name }}"
          done

      - name: Bump build number and release SHA
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          next=$((${{ needs.build.outputs.build-num }} + 1))
          gh variable set FA_BUILD --body "$next"
          gh variable set LAST_RELEASE_SHA --body "$GITHUB_SHA"
